<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ repo_info.full_name }} -- RepoLens</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <h1>RepoLens</h1>
    <p class="tagline">Report for <a href="{{ repo_info.url }}" style="color:var(--accent)">{{ repo_info.full_name }}</a></p>

    <div class="report">
      {{ report_html | safe }}
    </div>

    <div class="actions">
      <a href="{{ url_for('index') }}">&larr; Explain another repo</a>
      <button type="button" onclick="copyReport()">Copy raw markdown</button>
    </div>
    <textarea id="raw-md" style="position:absolute; left:-9999px;">{{ report_md }}</textarea>

    <script>
      function copyReport() {
        var el = document.getElementById('raw-md');
        el.select();
        navigator.clipboard.writeText(el.value);
      }
    </script>

    <footer>Generated by RepoLens.</footer>
  </div>
</body>
</html>
